name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.31"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Integration tests (TimescaleDB + lldap containers)
        working-directory: .
        run: scripts/integration-test.sh

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Static binary, no runtime dependencies (NFR-01)
        run: |
          CGO_ENABLED=0 go build -o janus-agent ./cmd/janus-agent
          file janus-agent | grep -q "statically linked"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: [backend, agent, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/src/janus_ops/__init__.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # on a release tag the agent signatures (made offline, agent/release/) are mandatory
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REQUIRE_SIGNED=${{ github.ref_type == 'tag' }}
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            lordraw/janus-ops:${{ steps.version.outputs.version }}
            lordraw/janus-ops:${{ steps.version.outputs.minor }}
            lordraw/janus-ops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub overview
        if: github.ref_type == 'tag'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: lordraw/janus-ops
          short-description: "One portal for your infrastructure: monitoring, containers, Proxmox, SSH, Ansible, AI."
          readme-filepath: docs/dockerhub/OVERVIEW.md
