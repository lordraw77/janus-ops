# SNMP trap receiver (v2c). Add it to the stack:
#   docker compose -f deploy/compose.yaml -f deploy/compose.snmp-traps.yaml --env-file deploy/.env up -d
# or with make: make docker/run COMPOSE_EXTRA="-f deploy/compose.snmp-traps.yaml"
#
# The app listens on 1162 (no privileges needed) and the host publishes it as 162/udp. Devices send
# their traps to <this host>:162 with one of the communities below. Only traps from an inventory node
# (same address, no SNMP capability or credential needed) are kept; anything else is dropped and counted.
services:
  janus-ops:
    environment:
      JANUS_SNMP_TRAP_PORT: "1162"
      JANUS_SNMP_TRAP_COMMUNITIES: ${JANUS_SNMP_TRAP_COMMUNITIES:?set JANUS_SNMP_TRAP_COMMUNITIES (comma-separated)}
    ports:
      - "${JANUS_SNMP_TRAP_HOST_PORT:-162}:1162/udp"
