# Janus-Ops stack. Runs the published image; from a source checkout `make docker/run`
# adds compose.build.yaml to build it locally. Variables: deploy/.env.example.
name: janus-ops

# Settings shared by the app and the setup job
x-janus-env: &janus-env
  JANUS_DATABASE_URL: postgresql+asyncpg://janus:${POSTGRES_PASSWORD:?run make env}@db:5432/janus
  JANUS_LOG_LEVEL: ${JANUS_LOG_LEVEL:-INFO}
  JANUS_LDAP_URL: ldap://ldap:3890
  JANUS_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=janus-ops,dc=local}
  JANUS_LDAP_BIND_DN: uid=janus-svc,ou=people,${LDAP_BASE_DN:-dc=janus-ops,dc=local}
  JANUS_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:?run make env}
  # User and group administration from the UI (account janus-manager, group lldap_admin)
  JANUS_LLDAP_HTTP_URL: http://ldap:17170
  JANUS_LDAP_MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:?run make env}

services:
  proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "${JANUS_HTTP_PORT:-80}:80"
      - "${JANUS_HTTPS_PORT:-443}:443"
    environment:
      JANUS_DOMAIN: ${JANUS_DOMAIN:-localhost}
      JANUS_TLS: ${JANUS_TLS:-internal}
    # Publishes the internal CA's root certificate for agents (see the script)
    entrypoint: ["/bin/sh", "/usr/local/bin/caddy-entrypoint.sh"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
      - pki_public:/pki-public
    depends_on:
      janus-ops:
        condition: service_healthy
    networks: [edge]

  janus-ops:
    image: ${JANUS_IMAGE:-lordraw/janus-ops}:${JANUS_VERSION:-0.6.0}
    restart: unless-stopped
    environment:
      <<: *janus-env
      # Only the proxy can reach this container (no published port)
      JANUS_FORWARDED_ALLOW_IPS: "*"
      # Master key: local (JANUS_SECRET_KEY) or an external OpenBao / Vault Transit (FR-86). With
      # Transit the local key may stay set while secrets are moved (janus-ops secrets migrate).
      JANUS_SECRET_KEY: ${JANUS_SECRET_KEY:-}
      JANUS_SECRET_BACKEND: ${JANUS_SECRET_BACKEND:-local}
      JANUS_BAO_ADDR: ${JANUS_BAO_ADDR:-}
      JANUS_BAO_ROLE_ID: ${JANUS_BAO_ROLE_ID:-}
      JANUS_BAO_SECRET_ID: ${JANUS_BAO_SECRET_ID:-}
      JANUS_BAO_TRANSIT_MOUNT: ${JANUS_BAO_TRANSIT_MOUNT:-transit}
      JANUS_BAO_TRANSIT_KEY: ${JANUS_BAO_TRANSIT_KEY:-janus-kek}
      JANUS_BAO_KV_MOUNT: ${JANUS_BAO_KV_MOUNT:-secret}
      JANUS_BAO_KV_PREFIX: ${JANUS_BAO_KV_PREFIX:-janus-ops}
      JANUS_BAO_CA_FILE: ${JANUS_BAO_CA_FILE:-}
      JANUS_BAO_DEK_CACHE_S: ${JANUS_BAO_DEK_CACHE_S:-300}
      JANUS_DB_POOL_SIZE: ${JANUS_DB_POOL_SIZE:-20}
      JANUS_DB_MAX_OVERFLOW: ${JANUS_DB_MAX_OVERFLOW:-20}
      JANUS_SESSION_TTL_S: ${JANUS_SESSION_TTL_S:-28800}
      JANUS_SESSION_IDLE_S: ${JANUS_SESSION_IDLE_S:-3600}
      JANUS_BREAKGLASS_USERNAME: ${JANUS_BREAKGLASS_USERNAME:-breakglass}
      # SSH bastion: terminal recordings (asciicast) on the "recordings" volume
      JANUS_RECORDINGS_DIR: ${JANUS_RECORDINGS_DIR-/var/lib/janus-ops/recordings}
      JANUS_TERMINAL_IDLE_S: ${JANUS_TERMINAL_IDLE_S:-1800}
      JANUS_TERMINAL_MAX_PER_USER: ${JANUS_TERMINAL_MAX_PER_USER:-10}
      JANUS_SFTP_MAX_UPLOAD_MB: ${JANUS_SFTP_MAX_UPLOAD_MB:-1024}
      # Agents (F2): URL they connect to (default: the URL used in the browser) and the CA
      # they trust for it (Caddy's internal root, published by the proxy)
      JANUS_AGENT_SERVER_URL: ${JANUS_AGENT_SERVER_URL:-}
      JANUS_AGENT_CA_FILE: ${JANUS_AGENT_CA_FILE-/var/lib/janus-ops/pki/root.crt}
      JANUS_AGENT_INTERVAL_S: ${JANUS_AGENT_INTERVAL_S:-10}
      # Signed agent self-update (FR-84): public key of the release key (janus-ops agent-keygen)
      JANUS_AGENT_RELEASE_PUBLIC_KEY: ${JANUS_AGENT_RELEASE_PUBLIC_KEY:-}
      # AI Copilot (F7): off unless the endpoint and the model are set
      JANUS_AI_BASE_URL: ${JANUS_AI_BASE_URL:-}
      JANUS_AI_MODEL: ${JANUS_AI_MODEL:-}
      JANUS_AI_API_KEY: ${JANUS_AI_API_KEY:-}
      JANUS_AI_TIMEOUT_S: ${JANUS_AI_TIMEOUT_S:-120}
    volumes:
      - recordings:/var/lib/janus-ops/recordings
      - pki_public:/var/lib/janus-ops/pki:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, backend]

  # One-shot: database migrations, then the initial administrator (created only if missing)
  setup:
    image: ${JANUS_IMAGE:-lordraw/janus-ops}:${JANUS_VERSION:-0.6.0}
    command: ["setup"]
    restart: "no"
    environment:
      <<: *janus-env
      JANUS_ADMIN_USERNAME: ${JANUS_ADMIN_USERNAME:-janus-admin}
      JANUS_ADMIN_PASSWORD: ${JANUS_ADMIN_PASSWORD:-}
      JANUS_ADMIN_EMAIL: ${JANUS_ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  db:
    image: timescale/timescaledb:2.32.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: janus
      POSTGRES_DB: janus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "janus", "-d", "janus", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [backend]

  ldap:
    image: lldap/lldap:v0.6.3
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=janus-ops,dc=local}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?run make env}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:?run make env}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:?run make env}
    ports:
      # Directory admin UI: loopback only, reach it through an SSH tunnel (ADR-008)
      - "127.0.0.1:${LLDAP_UI_PORT:-17170}:17170"
    volumes:
      - ldap_data:/data
    # ldap_ui: an internal-only network cannot publish the admin UI port
    networks: [backend, ldap_ui]

  # One-shot, idempotent: creates the janus-* groups, the read-only service account
  # (janus-svc, sign-in lookups) and the manager account (janus-manager, user administration)
  # with lldap's own bootstrap script.
  ldap-init:
    image: lldap/lldap:v0.6.3
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        B=/tmp/bootstrap
        mkdir -p "$$B/users" "$$B/groups" "$$B/schemas"
        for g in lldap_strict_readonly lldap_admin janus-admins janus-operators janus-auditors; do
          printf '{"name": "%s"}\n' "$$g" >> "$$B/groups/groups.json"
        done
        umask 077
        printf '%s' "$$SVC_PASSWORD" > "$$B/svc-password"
        printf '{"id": "janus-svc", "email": "janus-svc@janus-ops.invalid", "displayName": "Janus-Ops service account", "password_file": "%s", "groups": ["lldap_strict_readonly"]}\n' "$$B/svc-password" > "$$B/users/janus-svc.json"
        printf '%s' "$$MANAGER_PASSWORD" > "$$B/manager-password"
        printf '{"id": "janus-manager", "email": "janus-manager@janus-ops.invalid", "displayName": "Janus-Ops directory manager", "password_file": "%s", "groups": ["lldap_admin"]}\n' "$$B/manager-password" > "$$B/users/janus-manager.json"
        # The image's curl cannot use Docker's DNS: resolve the service name with getent
        LDAP_IP="$$(getent hosts ldap | awk '{print $$1; exit}')"
        [ -n "$$LDAP_IP" ] || { echo "cannot resolve ldap" >&2; exit 1; }
        export LLDAP_URL="http://$$LDAP_IP:17170"
        exec /app/bootstrap.sh
    environment:
      LLDAP_ADMIN_USERNAME: admin
      LLDAP_ADMIN_PASSWORD: ${LLDAP_ADMIN_PASSWORD:?run make env}
      SVC_PASSWORD: ${LDAP_BIND_PASSWORD:?run make env}
      MANAGER_PASSWORD: ${LDAP_MANAGER_PASSWORD:?run make env}
      USER_CONFIGS_DIR: /tmp/bootstrap/users
      GROUP_CONFIGS_DIR: /tmp/bootstrap/groups
      USER_SCHEMAS_DIR: /tmp/bootstrap/schemas
      GROUP_SCHEMAS_DIR: /tmp/bootstrap/schemas
    depends_on:
      ldap:
        condition: service_healthy
    # The lldap image's healthcheck probes a server this job does not run
    healthcheck:
      disable: true
    read_only: true
    tmpfs: [/tmp]
    networks: [backend]

networks:
  edge:
  backend:
    internal: true
  ldap_ui:

volumes:
  recordings:
  pki_public:
  caddy_data:
  caddy_config:
  pg_data:
  ldap_data:
