# Optional overlay: lets the Copilot start the MCP servers (lordraw/linux-mcp, lordraw/proxmox-mcp)
# with `docker run -i`. It gives the backend access to the host's Docker: that is root-equivalent on
# the host, so use it only on a host you accept that for, or point JANUS_MCP_DOCKER_HOST at a socket
# proxy that allows only container create/start/attach/wait/kill/delete and image inspect/pull.
#   docker compose -f deploy/compose.yaml -f deploy/compose.mcp.yaml up -d
services:
  janus-ops:
    volumes:
      - ${JANUS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      JANUS_AI_MCP_ENABLED: "true"
      JANUS_AI_MCP_NETWORK: self
    group_add:
      - ${JANUS_DOCKER_GID:-0}
